description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Java, Node.js, .NET, Nginx, HTTPD and Procfile"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.85"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.5.0"
  version = "14.5.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:21.6.0"
  version = "21.6.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.2.9"
  version = "10.2.9"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.2.12"
  version = "4.2.12"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.2"
  version = "5.13.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.2.9"
  version = "4.2.9"

[lifecycle]
  version = "0.21.8"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.5.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "21.6.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.2.9"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.2.9"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.2.12"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.2"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[stack]
  id = "io.buildpacks.stacks.noble"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
