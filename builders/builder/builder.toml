description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, Procfile, and Python"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.113"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.7.1"
  version = "4.7.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.19.23"
  version = "4.19.23"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.9.0"
  version = "14.9.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.3.0"
  version = "22.3.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.9.0"
  version = "10.9.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.6"
  version = "5.13.6"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/python:2.57.0"
  version = "2.57.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.8.0"
  version = "4.8.0"

[lifecycle]
  version = "0.21.15"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.7.1"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.19.23"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/python"
    version = "2.57.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.8.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.9.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.3.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.9.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.6"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[stack]
  id = "io.buildpacks.stacks.noble"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
