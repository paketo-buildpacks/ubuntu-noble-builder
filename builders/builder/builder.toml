description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.130"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.10.0"
  version = "4.10.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.20.0"
  version = "4.20.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.11.0"
  version = "14.11.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.4.0"
  version = "22.4.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.11.0"
  version = "10.11.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.4.0"
  version = "3.4.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.14.0"
  version = "5.14.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/python:2.62.0"
  version = "2.62.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:3.0.5"
  version = "3.0.5"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.11.0"
  version = "4.11.0"

[lifecycle]
  version = "0.21.19"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "3.0.5"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.10.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.20.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/python"
    version = "2.62.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/php"
    version = "3.4.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.11.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.11.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.4.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.11.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.14.0"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[stack]
  id = "io.buildpacks.stacks.noble"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
