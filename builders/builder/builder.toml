description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Java, Go, .NET Core, Node.js, Python, Apache HTTPD, NGINX and Procfile"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.31"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:9.7.0"
  version = "9.7.0"

[lifecycle]
  version = "0.20.14"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "9.7.0"

[stack]
  id = "io.buildpacks.stacks.noble"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[[targets]]
  arch = "amd64"
  os = "linux"


[[targets]]
  arch = "arm64"
  os = "linux"
