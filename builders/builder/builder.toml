description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.117"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.8.0"
  version = "4.8.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.19.25"
  version = "4.19.25"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.11.0"
  version = "14.11.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.4.0"
  version = "22.4.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.9.2"
  version = "10.9.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.2.1"
  version = "3.2.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.7"
  version = "5.13.7"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/python:2.59.0"
  version = "2.59.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:3.0.2"
  version = "3.0.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.9.1"
  version = "4.9.1"

[lifecycle]
  version = "0.21.17"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "3.0.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.8.0"

[[order]]

  [[order.group]]
