description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.148"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.12.4"
  version = "4.12.4"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.23.0"
  version = "4.23.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.14.0"
  version = "14.14.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.7.0"
  version = "22.7.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.14.0"
  version = "10.14.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.7.3"
  version = "3.7.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.5"
  version = "5.15.5"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/python:2.65.2"
  version = "2.65.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:3.1.3"
  version = "3.1.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.14.2"
  version = "4.14.2"

[lifecycle]
  version = "0.21.25"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "3.1.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.12.4"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.23.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/python"
    version = "2.65.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/php"
    version = "3.7.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.14.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.14.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.7.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.14.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.5"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[stack]
  id = "io.buildpacks.stacks.noble"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
