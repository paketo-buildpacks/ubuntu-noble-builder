description = "Ubuntu 24.04 Noble Numbat base image with buildpacks for Java, Node.js, .NET, Nginx, HTTPD and Procfile"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.91"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.6.0"
  version = "14.6.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.0.0"
  version = "22.0.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.3.3"
  version = "10.3.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.3.3"
  version = "4.3.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.3"
  version = "5.13.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.3.2"
  version = "4.3.2"

[lifecycle]
  version = "0.21.12"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.6.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.0.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.3.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.3.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.3.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.3"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-noble-run:latest"

[stack]
  id = "io.buildpacks.stacks.noble"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
